# Loki — OTT service logs (player, cdn, origin, transcoder).
# Single-binary, local filesystem, no auth. Run from repo root so
# .runtime paths resolve.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: .runtime/loki-data
  storage:
    filesystem:
      chunks_directory: chunks
      rules_directory: rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2025-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        period: 24h
        prefix: index_

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  reject_old_samples: false
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: .runtime/loki-data/compactor
  retention_enabled: true
  delete_request_store: filesystem

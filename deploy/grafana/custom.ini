app_mode = production

[server]
http_addr = 127.0.0.1
http_port = 3000

[analytics]
reporting_enabled = false
check_for_updates = false

[news]
news_feed_enabled = false

[users]
# Local demo instance; keep default admin/admin for first login,
# bootstrap-service-account.cmd creates a dedicated token for MCP.
allow_sign_up = false

[auth.anonymous]
enabled = false

[plugins]
check_for_plugin_updates = false
plugin_admin_enabled = true

[log]
level = info

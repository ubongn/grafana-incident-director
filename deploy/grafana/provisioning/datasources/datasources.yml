apiVersion: 1

datasources:
  - name: OTT-Prometheus
    uid: prom-ott
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s

  - name: OTT-Loki
    uid: loki-ott
    type: loki
    access: proxy
    url: http://localhost:3100
    editable: false
    jsonData:
      maxLines: 500
      derivedFields:
        - name: SessionID
          matcherRegex: "session=([a-zA-Z0-9-]+)"
          url: "$${__value.raw}"

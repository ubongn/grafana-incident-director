[project]
name = "incident-director"
version = "0.2.0"
description = "Grafana Incident Director — agentic incident loop over the Grafana stack via MCP (Google ADK + Gemini)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-adk>=2.7.1,<3",
    "google-genai>=2.20.0,<3",
    "mcp>=1.24,<2",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
incident-director = "incident_director.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["incident_director"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
